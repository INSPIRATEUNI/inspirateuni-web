<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f7f5fb;font-family:Arial,Helvetica,sans-serif;color:#2b2140;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 8px;font-size:13px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#7a7090;">
            Inspírate UNI · Open Day
          </p>
          <h1 style="margin:0 0 16px;font-size:22px;">Tu código de acceso</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">
            Escribe este código en la página de inscripción para continuar:
          </p>
          <p style="margin:0 0 24px;font-size:36px;font-weight:bold;letter-spacing:10px;text-align:center;color:#d6247a;">
            {{ .Token }}
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#7a7090;">
            Vence en una hora y solo sirve una vez. Si no pediste este código, ignora este correo.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
